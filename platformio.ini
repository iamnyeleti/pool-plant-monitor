; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

; Libraries this project depends on. PlatformIO downloads and manages
; these automatically -- you never place library code in lib/ yourself
; unless you're writing your own custom library.
lib_deps =
    adafruit/Adafruit MPU6050@^2.2.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/RTClib@^2.1.4
; Sets how fast the Serial Monitor communicates -- must match the
; Serial.begin(115200) call in main.cpp, or the output will look
; like garbled text.
monitor_speed = 115200

; Explicitly telling PlatformIO which COM port to use for uploading
; and monitoring. This matters because your laptop also has two
; Bluetooth virtual COM ports (COM3,wo COM4) that could otherwise
; confuse auto-detection -- COM5 is your actual ESP32 (Silicon Labs
; CP210x), confirmed via Device Manager.
upload_port = COM5
monitor_port = COM5